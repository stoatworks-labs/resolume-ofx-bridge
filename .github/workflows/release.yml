name: release

# Build the OFX bridge tools and the FFGL wrapper template.
#
# The tools are macOS only. The shells job below also builds the FFGL->OFX
# shell for Windows and Linux — that is what the browser wrapper serves — and
# those are labelled compiled-not-run wherever they appear, because there is no
# Windows or Linux machine here to execute them on. Compiling is real evidence;
# running is the evidence we do not have. See docs/03-verification.md.
#
# macos-14 is arm64 and cross-compiles the x86_64 slice; the Intel macOS runners
# are retired, so never target macos-13.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  shells:
    name: shell-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest }
          - { name: linux-x86_64,   os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglew-dev libegl1-mesa-dev libgl1-mesa-dev libexpat1-dev

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install glew:x64-windows expat:x64-windows

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build the shell
        run: cmake --build build --config Release --target ffglofxshell

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shellout
          src="build/ffglofxshell.ofx"
          [ -f "build/Release/ffglofxshell.ofx" ] && src="build/Release/ffglofxshell.ofx"
          cp "$src" "shellout/ffglofxshell-${{ matrix.name }}.ofx"
          ls -l shellout

      - uses: actions/upload-artifact@v4
        with:
          name: shell-${{ matrix.name }}
          path: shellout/*
          if-no-files-found: error

  build:
    name: macos-universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build -j3

      - name: Verify the binaries are actually universal
        # A "universal" build that quietly produced one slice is the classic
        # CMake failure here, and the build log looks identical either way.
        run: |
          set -euo pipefail
          for f in build/ofxgen build/ofxprobe build/ofxwrapper.bundle/Contents/MacOS/ofxwrapper \
                   "build/OFX Bridge.app/Contents/MacOS/OFX Bridge"; do
            archs=$(lipo -archs "$f")
            echo "$f: $archs"
            case "$archs" in
              *arm64*) ;;
              *) echo "::error::$f is missing the arm64 slice"; exit 1 ;;
            esac
            case "$archs" in
              *x86_64*) ;;
              *) echo "::error::$f is missing the x86_64 slice"; exit 1 ;;
            esac
          done

      - name: Self-test against real OFX plugins
        # Builds a corpus from the OpenFX examples and runs the bridge end to end,
        # so a release cannot ship a binary that fails its own harness.
        run: |
          set -euo pipefail
          ./scripts/build-test-plugins.sh
          ./build/ofxprobe --dir build/test-plugins
          ./build/ofxprobe --dir build/test-plugins \
            --render uk.co.thefoundry.OfxInvertExample
          ./build/ofxgen generate --dir build/test-plugins --out build/generated
          ./build/ofxgen verify build/generated/OFX_Gain_Example.bundle
          # The GL render path needs a legacy profile for this plugin; see
          # docs/04-gpu-acceleration.md. Runners are headless, so a failure to
          # create a context is tolerated -- what must not break is the build.
          # Assert actual pixels, not just an exit code: a black frame must fail.
          ./build/ffgltest build/generated/OFX_Invert_Example.bundle \
            --expect-centre 127,127,127,0

          # The GPU paths need a real GPU. Hosted runners have only the Apple
          # Software Renderer, on which IOSurface-backed GL/Metal sharing cannot
          # work -- so --require-gpu exits 3 and we skip, rather than reporting a
          # pass that means nothing. Any other non-zero status is a real failure.
          for t in "OFX_OpenGL_Example.bundle --legacy-gl" \
                   "Metal_Gain_Example.bundle 0=0.5 --expect-centre 64,64,64,127" \
                   "OpenCL_Gain_Example.bundle 0=0.5 --expect-centre 64,64,64,127"; do
            set +e
            ./build/ffgltest build/generated/$t --require-gpu
            rc=$?
            set -e
            if [ $rc -eq 3 ]; then
              echo "::notice::skipped GPU self-test ($t): no GPU on this runner"
            elif [ $rc -ne 0 ]; then
              echo "::error::GPU self-test failed ($t)"
              exit 1
            fi
          done

      - name: Stage the release archive
        run: |
          set -euo pipefail
          mkdir -p dist/resolume-ofx-bridge
          cp -R build/ofxwrapper.bundle dist/resolume-ofx-bridge/
          # The app carries its own copy of the wrapper in Resources, so it works
          # on its own; the loose one above is what the CLI uses.
          cp -R "build/OFX Bridge.app" dist/resolume-ofx-bridge/
          cp build/ofxgen build/ofxprobe dist/resolume-ofx-bridge/
          # The FFGL->OFX shell, found by ofxgen wrap-ffgl next to itself.
          cp build/ffglofxshell.ofx dist/resolume-ofx-bridge/
          cp README.md CHANGELOG.md LICENSE dist/resolume-ofx-bridge/
          cp -R docs dist/resolume-ofx-bridge/docs
          cd dist && zip -r resolume-ofx-bridge-macos-universal.zip resolume-ofx-bridge

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/resolume-ofx-bridge-macos-universal.zip

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/resolume-ofx-bridge-macos-universal.zip
          fail_on_unmatched_files: true
